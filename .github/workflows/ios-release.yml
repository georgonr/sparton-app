# iOS vydanie appky spartON do App Store Connect (TestFlight) – PRIPRAVENÉ, ZATIAĽ NEAKTÍVNE.
# Spúšťa sa len ručne a skončí hneď na kontrole, kým nie sú doplnené secrets (Apple Developer účet MACET čaká na schválenie).
#
# Po schválení účtu stačí doplniť (repo → Settings → Secrets and variables → Actions):
#   secrets  APPSTORE_API_KEY_P8_B64   – obsah súboru AuthKey_<KEYID>.p8 v base64 (App Store Connect → Users and Access →
#                                         Integrations → App Store Connect API → Team Keys, rola Admin)
#            APPSTORE_API_KEY_ID       – Key ID (10 znakov)
#            APPSTORE_API_ISSUER_ID    – Issuer ID (UUID nad zoznamom kľúčov)
#            IOS_GOOGLE_SERVICE_INFO_PLIST_B64 – Firebase projekt sparton-app, iOS appka eu.sparton.app (push)
#   variables IOS_TEAM_ID              – Team ID (10 znakov, developer.apple.com → Membership)
#             GOOGLE_IOS_CLIENT_ID     – iOS OAuth klient Google (projekt sparton-514413), verejné ID
# Podpis je automatický cez API kľúč (-allowProvisioningUpdates): Xcode si vytvorí App ID eu.sparton.app so schopnosťami
# z App.entitlements (Push, Sign in with Apple, Associated Domains), distribučný certifikát (cloud) a profil.
# Číslo zostavenia = číslo behu tohto workflow; verzia = MARKETING_VERSION v projekte.
name: iOS – vydanie do App Store Connect (pripravené)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM: ${{ vars.IOS_TEAM_ID }}
      GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
      KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
      ISSUER: ${{ secrets.APPSTORE_API_ISSUER_ID }}
    steps:
      - name: Kontrola predpokladov
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
          GSI: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          miss=""
          [ -z "$TEAM" ] && miss="$miss IOS_TEAM_ID"
          [ -z "$KEY_ID" ] && miss="$miss APPSTORE_API_KEY_ID"
          [ -z "$ISSUER" ] && miss="$miss APPSTORE_API_ISSUER_ID"
          [ -z "$P8" ] && miss="$miss APPSTORE_API_KEY_P8_B64"
          [ -z "$GSI" ] && miss="$miss IOS_GOOGLE_SERVICE_INFO_PLIST_B64"
          if [ -n "$miss" ]; then
            echo "::error::iOS vydanie ešte nie je nastavené – chýba:$miss (pozri komentár v ios-release.yml)"
            exit 1
          fi
          echo "$TEAM" | grep -Eq '^[A-Z0-9]{10}$' || { echo "::error::IOS_TEAM_ID má mať 10 znakov A–Z/0–9"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Závislosti, Capacitor a tajomstvá do dočasných súborov
        env:
          P8: ${{ secrets.APPSTORE_API_KEY_P8_B64 }}
          GSI: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          set -euo pipefail
          npm ci
          npx cap sync ios
          echo "$GSI" | base64 -d > ios/App/App/GoogleService-Info.plist
          umask 077
          echo "$P8" | base64 -d > "$RUNNER_TEMP/AuthKey.p8"
          if [ -n "$GOOGLE_IOS_CLIENT_ID" ]; then
            REV=$(echo "$GOOGLE_IOS_CLIENT_ID" | awk -F. '{for(i=NF;i>0;i--) printf "%s%s",$i,(i>1?".":"")}')
          else
            REV=eu.sparton.app.google-unset
          fi
          echo "GOOGLE_IOS_REVERSED_CLIENT_ID=$REV" >> "$GITHUB_ENV"

      - name: Archív (podpis cez App Store Connect API)
        run: |
          set -euo pipefail
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            GOOGLE_IOS_CLIENT_ID="$GOOGLE_IOS_CLIENT_ID" GOOGLE_IOS_REVERSED_CLIENT_ID="$GOOGLE_IOS_REVERSED_CLIENT_ID" \
            -quiet archive

      - name: Kontrola archívu (entitlements, verzia)
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app"
          codesign -d --entitlements :- "$A" | tee "$RUNNER_TEMP/ent.plist" >/dev/null
          grep -q 'applinks:sparton.eu' "$RUNNER_TEMP/ent.plist"
          grep -q 'com.apple.developer.applesignin' "$RUNNER_TEMP/ent.plist"
          grep -q 'aps-environment' "$RUNNER_TEMP/ent.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' -c 'Print :CFBundleVersion' "$A/Info.plist"

      - name: Export a nahratie do App Store Connect
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER"
          echo "Nahraté – zostavenie ${{ github.run_number }} sa objaví v App Store Connect → TestFlight po spracovaní (5–30 min)."

      - name: Upratanie tajomstiev
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8" ios/App/App/GoogleService-Info.plist
