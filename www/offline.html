<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f2f4ef">
<title>spartON – offline</title>
<style>
:root{color-scheme:light dark;--bg:#f2f4ef;--ink:#0e1d14;--muted:#4b5f52;--green:#168342}
@media (prefers-color-scheme:dark){:root{--bg:#06140c;--ink:#e8f2ea;--muted:#a3b5aa;--green:#c8f560}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;-webkit-tap-highlight-color:transparent}
main{max-width:22rem}
svg{display:block;margin:0 auto 20px}
h1{font-size:24px;line-height:1.2;margin:0 0 10px;font-weight:800;letter-spacing:-.01em}
p{color:var(--muted);line-height:1.5;margin:0 0 24px;font-size:16px}
button{appearance:none;border:0;border-radius:14px;background:var(--green);color:#fff;font:inherit;font-weight:700;font-size:16px;padding:14px 24px;min-height:48px;min-width:12rem}
@media (prefers-color-scheme:dark){button{color:#0b2a19}}
button[disabled]{opacity:.6}
.hint{font-size:13px;margin-top:16px;margin-bottom:0}
</style>
</head>
<body>
<main>
  <svg width="88" height="88" viewBox="0 0 40 40" aria-hidden="true">
    <circle cx="20" cy="20" r="19" fill="#168342"/>
    <circle cx="20" cy="20" r="11.5" fill="#fff"/>
    <path d="M20 12.5l4.2 3-1.6 5h-5.2l-1.6-5z" fill="#13201a"/>
    <path d="M20 8.5v4M28.7 14.6l-4.5 1M27 26.8l-4.4-6.3M13 26.8l4.4-6.3M11.3 14.6l4.5 1" stroke="#13201a" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M33 9.5a16 16 0 0 1 3 8" stroke="#ff8137" stroke-width="2.6" stroke-linecap="round" fill="none"/>
  </svg>
  <h1 id="h" data-testid="offline-title">Si offline</h1>
  <p id="p">Bez internetu sa spartON nenačíta. Pripoj sa a skús to znova – nič sa nestratilo.</p>
  <button id="b" type="button">Skúsiť znova</button>
  <p class="hint" id="s">Keď sa pripojíš, appka sa načíta sama.</p>
</main>
<script>
/* Obrazovka „si offline" appky spartON – servíruje ju appka lokálne, jazyk podľa zariadenia, tyká. */
(function () {
  var T = {
    cs: ['Jsi offline', 'Bez internetu se spartON nenačte. Připoj se a zkus to znovu – nic se neztratilo.', 'Zkusit znovu', 'Jakmile se připojíš, aplikace se načte sama.'],
    en: ['You are offline', 'spartON cannot load without the internet. Connect and try again – nothing has been lost.', 'Try again', 'Once you are back online, the app will load by itself.']
  };
  var l = (navigator.language || 'sk').slice(0, 2).toLowerCase();
  var t = T[l];
  if (t) {
    document.documentElement.lang = l;
    document.getElementById('h').textContent = t[0];
    document.getElementById('p').textContent = t[1];
    document.getElementById('b').textContent = t[2];
    document.getElementById('s').textContent = t[3];
  }
  function retry() {
    var b = document.getElementById('b');
    b.disabled = true;
    setTimeout(function () { b.disabled = false; }, 1500);
    // natívna časť appky si pamätá stránku, ktorá sa nenačítala; bez nej začni od prehľadu
    if (window.spartonNative && window.spartonNative.postMessage) {
      window.spartonNative.postMessage(JSON.stringify({ type: 'retry' }));
    } else {
      location.replace('https://sparton.eu/app');
    }
  }
  document.getElementById('b').addEventListener('click', retry);
  window.addEventListener('online', retry);
})();
</script>
</body>
</html>
